---
# Main task file for ocp4_workload_openshift_virt
# Dispatches based on ACTION

- name: Run workload tasks for OpenShift Virtualization
  when: ACTION == "provision" or ACTION == "create"
  ansible.builtin.include_tasks: workload.yml

- name: Run removal tasks for OpenShift Virtualization
  when: ACTION == "destroy" or ACTION == "remove"
  ansible.builtin.include_tasks: remove.yml
