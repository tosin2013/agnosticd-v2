---
# Install Red Hat Advanced Cluster Management (RHACM)

- name: Create RHACM namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_rhacm_namespace }}"
    state: present

- name: Create OperatorGroup for RHACM
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: open-cluster-management-operatorgroup
        namespace: "{{ ocp4_workload_rhacm_namespace }}"
      spec:
        targetNamespaces:
          - "{{ ocp4_workload_rhacm_namespace }}"

- name: Subscribe to RHACM operator
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: advanced-cluster-management
        namespace: "{{ ocp4_workload_rhacm_namespace }}"
      spec:
        source: redhat-operators
        sourceNamespace: openshift-marketplace
        name: advanced-cluster-management
        channel: "{{ ocp4_workload_rhacm_channel }}"
        installPlanApproval: Automatic

- name: Wait for RHACM operator to be installed
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ ocp4_workload_rhacm_namespace }}"
  register: r_rhacm_csv
  retries: 30
  delay: 10
  until:
    - r_rhacm_csv.resources | length > 0
    - r_rhacm_csv.resources | selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0

- name: Get installed RHACM CSV name
  ansible.builtin.set_fact:
    rhacm_csv_name: "{{ r_rhacm_csv.resources | selectattr('status.phase', 'equalto', 'Succeeded') | map(attribute='metadata.name') | first }}"

- name: Wait for MultiClusterHub CRD to be available
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: multiclusterhubs.operator.open-cluster-management.io
  register: r_mch_crd
  retries: 30
  delay: 10
  until:
    - r_mch_crd.resources | length > 0
    - r_mch_crd.resources[0].status is defined
    - r_mch_crd.resources[0].status.conditions is defined
    - r_mch_crd.resources[0].status.conditions | selectattr('type', 'equalto', 'Established') | selectattr('status', 'equalto', 'True') | list | length > 0

- name: Wait for RHACM operator webhook endpoints to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Endpoints
    name: multiclusterhub-operator-webhook
    namespace: "{{ ocp4_workload_rhacm_namespace }}"
  register: r_mch_webhook
  retries: 30
  delay: 10
  until:
    - r_mch_webhook.resources | length > 0
    - r_mch_webhook.resources[0].subsets is defined
    - r_mch_webhook.resources[0].subsets | length > 0
    - r_mch_webhook.resources[0].subsets[0].addresses is defined
    - r_mch_webhook.resources[0].subsets[0].addresses | length > 0

- name: Create MultiClusterHub instance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.open-cluster-management.io/v1
      kind: MultiClusterHub
      metadata:
        name: multiclusterhub
        namespace: "{{ ocp4_workload_rhacm_namespace }}"
      spec:
        availabilityConfig: "{{ ocp4_workload_rhacm_availability }}"
        enableClusterBackup: "{{ ocp4_workload_rhacm_enable_cluster_backup }}"
  register: r_mch_create
  retries: 10
  delay: 15
  until: r_mch_create is not failed

- name: Wait for MultiClusterHub to be ready
  kubernetes.core.k8s_info:
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    name: multiclusterhub
    namespace: "{{ ocp4_workload_rhacm_namespace }}"
  register: r_mch
  retries: 90
  delay: 20
  until:
    - r_mch.resources | length > 0
    - r_mch.resources[0].status is defined
    - r_mch.resources[0].status.phase is defined
    - r_mch.resources[0].status.phase == 'Running'

- name: Get RHACM console URL
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: multicloud-console
    namespace: "{{ ocp4_workload_rhacm_namespace }}"
  register: r_rhacm_route

- name: Report deployment info
  agnosticd_user_info:
    msg: >-
      Red Hat Advanced Cluster Management {{ ocp4_workload_rhacm_version }} deployed successfully.
      RHACM Console: https://{{ r_rhacm_route.resources[0].spec.host }}

- name: Report deployment data
  agnosticd_user_info:
    data:
      rhacm_console_url: "https://{{ r_rhacm_route.resources[0].spec.host }}"
      rhacm_version: "{{ rhacm_csv_name }}"
      rhacm_namespace: "{{ ocp4_workload_rhacm_namespace }}"
